<!-- ============================================================
  PLANTILLA QUIZ DE VOCABULARIO — v1.0
  ============================================================
  PARA CREAR UNA NUEVA LECCIÓN:
  1. Duplica este archivo HTML (ej: LektionX.html)
  2. Cambia SOLO la constante VOCAB_FILE al inicio del <script>
     apuntando al JSON de tu nueva lección.
  3. Configura todo en el JSON — NADA va hardcodeado aquí.

  ESTRUCTURA DEL PROYECTO:
    proyecto/
    ├── LektionX.html          ← esta plantilla (solo cambiar VOCAB_FILE)
    ├── css/LektionX.css       ← estilos visuales del tema
    ├── vocabularios/LektionX.json  ← toda la configuración
    └── userconfig.json        ← nombres rápidos de usuario

  CAMPOS CLAVE DEL JSON:
  configuracion:
    tituloPagina       → título de la pestaña del navegador
    tema               → título principal (soporta "A → B")
    subtitulo          → subtítulo del header
    titulo             → badge del header
    iconosHeader[]     → emojis del header
    googleFonts        → URL de Google Fonts
    rutaCSS            → ruta al archivo CSS externo
    rutaInicio         → href del botón 🏠 Inicio
    storagePrefix      → prefijo único en localStorage (ej: "lektion3")
    idioma             → código de idioma para TTS (ej: "de-DE", "en-US")
    mostrarBorrarBitacora → true | false

  niveles.nivel1..4:
    icono, nombre, direccion, tipo, badge

  temaVisual:
    colores{}          → variables CSS (--texto-principal, --fondo-pagina, etc.)
    cursor             → emoji de cursor personalizado
    iconoCarga         → emoji en pantalla de carga
    decorLoading[]     → 4 emojis flotantes en loading
    emojisFlotantes[]  → emojis de fondo decorativos
    emojisConfetti[]   → emojis del confetti al acertar
    coloresConfetti[]  → colores del confetti

  textos:              → todos los textos visibles de la UI
    loadingTitulo, loadingFinal, loginTitulo, loginSubtitulo,
    loginBoton, levelTitulo, comprensionLabel, comprensionInicio,
    vocabBtn, progressBtn, logoutBtn, homeBtn,
    starFilterTextoInactivo, starFilterTextoActivo, starModeIndicador,
    vocabTitulo, vocabLblTotal, vocabLblStarred, vocabLblMarcado,
    vocabBtnFiltroEstrella, vocabBtnMarcarTodas, vocabBtnQuitarTodas,
    vocabBuscarPlaceholder, progressTitulo, progressLblSesiones,
    progressLblPromedio, progressLblMejor, progressLblUsuario,
    progressBtnBorrar, quizPuntos, quizSonidoBtn, quizVerificar,
    quizSiguiente, quizTipoMC, quizTipoWrite, quizTipoTF,
    quizTFVerdadero, quizTFFalso, resultadoLabel, resultadoNivelComp,
    resultadoRepetir, resultadoVerNiveles, volverMenu, volverBtn,
    guardarToast, ttsDisponible, ttsNoDisponible, ttsLeyendo, ttsLang,
    termometroTicks[], iconoUsuario, comprensionNivelTexto,
    alertErrorNombre, alertErrorRespuesta, alertCerrarSesion,
    alertMarcarTodas, alertQuitarTodas, alertSinEstrellas,
    alertSinPalabras, alertBitacoraVacia, alertBitacoraBorrada

  sonidos:
    correcto           → "aplausos" | "ninguno"
    incorrecto         → "fart" | "buzz" | "ninguno"
    confetti           → true | false

  resultados:
    stars3/2/1/0       → emojis de estrellas por tier
    trophy1/2/3/4      → emojis de trofeo por tier
    msg1/2/3/4         → mensajes de resultado ({usuario})
    perfectMsg         → mensaje cuando no hay errores
    grades{}           → textos de grado {90,75,60,0}

  voz:
    lang, rate, pitch  → configuración Web Speech API

  tiempos:
    respuestaCorrecta  → ms antes de pasar pregunta (correcto)
    respuestaIncorrecta→ ms antes de pasar pregunta (incorrecto)

  puntosPorNivel:
    nivel1..4          → puntos por respuesta correcta

  mensajesCorrectos[]  → mensajes al acertar ({puntos},{usuario},{racha})
  mensajesIncorrectos[]→ mensajes al fallar ({respuesta})

  vocabulario[]:
    id, nombreExtranjero, español, categoria
  ============================================================ -->

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  /* Pantalla de carga - visible por defecto */
  #loading-screen {
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg, #2c1810 0%, #3d2817 50%, #1a1a1a 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    z-index: 10000;
    color: #f5e6d3;
    font-family: var(--font-primary, 'Special Elite', cursive);
  }

  #loading-screen.hidden {
    display: none;
  }

  .loading-container {
    text-align: center;
    animation: fadeInScale 0.6s ease-out;
  }

  .loading-icon {
    font-size: 4rem;
    margin-bottom: 20px;
    animation: spin 2s linear infinite;
  }

  .loading-title {
    font-size: 1.8rem;
    font-weight: 700;
    margin-bottom: 12px;
    color: #fff8e1;
    letter-spacing: 2px;
  }

  .loading-text {
    font-size: 1.05rem;
    color: #d4a574;
    margin-bottom: 30px;
    letter-spacing: 1px;
  }

  .loading-dots {
    display: inline-flex;
    gap: 8px;
    justify-content: center;
  }

  .dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #d4a574;
    animation: bounce 1.4s infinite;
  }

  .dot:nth-child(1) { animation-delay: 0s; }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }

  /* Animaciones */
  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); opacity: 1; }
    50% { transform: translateY(-15px); opacity: 0.6; }
  }

  @keyframes fadeInScale {
    from {
      opacity: 0;
      transform: scale(0.8);
    }
    to {
      opacity: 1;
      transform: scale(1);
    }
  }

  /* Decoraciones flotantes en loading */
  .loading-decor {
    position: fixed;
    font-size: 2.5rem;
    opacity: 0.15;
    pointer-events: none;
    animation: float 6s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0px) rotate(0deg); }
    50% { transform: translateY(-20px) rotate(10deg); }
  }

  .decor-1 { top: 10%; left: 10%; animation-delay: 0s; }
  .decor-2 { top: 80%; right: 10%; animation-delay: 1s; }
  .decor-3 { bottom: 20%; left: 5%; animation-delay: 2s; }
  .decor-4 { top: 50%; right: 5%; animation-delay: 1.5s; }

<script>
// ═══════════════════════════════════════════════════════════════════════════
//  FUNCIÓN PARA ACTUALIZAR MENSAJES DE CARGA
// ═══════════════════════════════════════════════════════════════════════════
function updateLoadingMessage(message) {
  const msgEl = document.getElementById('loading-message');
  if (msgEl) {
    msgEl.textContent = message;
  }
}

function updateLoadingMessage(message) {
  const msgEl = document.getElementById('loading-message');
  if (msgEl) {
    msgEl.textContent = message;
  }
}

function hideLoadingScreen() {
  const loadingScreen = document.getElementById('loading-screen');
  if (loadingScreen) {
    loadingScreen.classList.add('hidden');
  }
}

// ═══════════════════════════════════════════════════════════════════════════
//  VARIABLES GLOBALES
// ═══════════════════════════════════════════════════════════════════════════
let CONFIG = null;
let USERCONFIG = null;
let vocab = [];
let QUICK_NAMES = [];
let currentUser = '';
let currentLevel = 0;
// STORAGE_PREFIX: se asigna desde CONFIG.configuracion.storagePrefix en aplicarConfiguracion()
// Permite que cada lección tenga su propio espacio en localStorage sin colisiones
let STORAGE_PREFIX = 'quiz';
let questions = [];
let qIndex = 0;
let score = 0;
let streak = 0;
let currentQ = null;
let wrongAnswers = [];
let starredWords = new Set();
let ttsAvailable = false;
let starFilterActive = false;
let starredOnlyFilter = false;
let quizStartTime = null;

// ═══════════════════════════════════════════════════════════════════════════
//  ⚙️  ÚNICA LÍNEA A CAMBIAR AL CREAR UNA NUEVA LECCIÓN
//  Apunta al JSON de la lección correspondiente
// ═══════════════════════════════════════════════════════════════════════════
const VOCAB_FILE = 'vocabularios/Lektion2CopiaIngles.json';

// ═══════════════════════════════════════════════════════════════════════════
//  CARGAR CONFIGURACIÓN DESDE ARCHIVOS JSON
// ═══════════════════════════════════════════════════════════════════════════
async function cargarConfiguracion() {
  try {
    // Paso 1: Cargar JSON principal
    updateLoadingMessage('📚 Cargando vocabulario...');
    const configRes = await fetch(VOCAB_FILE);
    CONFIG = await configRes.json();

    // Paso 2: Cargar Google Fonts dinámicamente desde JSON
    // CONFIG.configuracion.googleFonts = URL completa de Google Fonts
    updateLoadingMessage('🎨 Aplicando estilos...');
    if (CONFIG.configuracion.googleFonts) {
      const fontLink = document.createElement('link');
      fontLink.rel = 'stylesheet';
      fontLink.href = CONFIG.configuracion.googleFonts;
      document.head.appendChild(fontLink);
    }

    // Paso 3: Cargar CSS externo desde JSON
    if (CONFIG.configuracion.rutaCSS) {
      const cssLink = document.createElement('link');
      cssLink.rel = 'stylesheet';
      cssLink.href = CONFIG.configuracion.rutaCSS;
      document.head.appendChild(cssLink);
    }

    // Paso 4: Cargar userconfig.json
    updateLoadingMessage('👤 Cargando perfil...');
    const userRes = await fetch('userconfig.json');
    USERCONFIG = await userRes.json();
    QUICK_NAMES = USERCONFIG.quickNames;

    // Paso 5: Procesar vocabulario al formato interno
    updateLoadingMessage('⚙️ Procesando palabras...');
    vocab = CONFIG.vocabulario.map(item => ({
      id: item.id,
      word: item.nombreExtranjero,
      translation: item.español,
      category: item.categoria
    }));

    // Paso 6: Mensaje final desde JSON
    // CONFIG.textos.loadingFinal = ej. "¡Listo para investigar!"
    updateLoadingMessage(CONFIG.textos?.loadingFinal || '✅ ¡Listo!');
    await new Promise(r => setTimeout(r, 800));

    return true;
  } catch (error) {
    console.error('Error cargando configuración:', error);
    hideLoadingScreen();
    alert(`⚠️ Error cargando archivos de configuración.\n\nVerifica que existan:\n- ${VOCAB_FILE}\n- userconfig.json`);
    return false;
  }
}

// ═══════════════════════════════════════════════════════════════════════════
//  APLICAR CONFIGURACIÓN VISUAL Y TEXTOS DESDE JSON
// ═══════════════════════════════════════════════════════════════════════════
function aplicarConfiguracion() {
  const cfg  = CONFIG.configuracion;
  const tema = CONFIG.temaVisual;
  const txt  = CONFIG.textos || {};

  // ── Título pestaña navegador
  document.getElementById('page-title').textContent = cfg.tituloPagina || cfg.tema || 'Vocabulary Quiz';

  // ── Fuentes tipográficas como variables CSS
  // cfg.fontPrimary → fuente principal (ej. "'Special Elite', cursive")
  // cfg.fontDisplay → fuente de títulos  (ej. "'Playfair Display', serif")
  // cfg.fontBody    → fuente de cuerpo   (ej. "'Crimson Text', serif")
  if (cfg.fontPrimary) document.documentElement.style.setProperty('--font-primary', cfg.fontPrimary);
  if (cfg.fontDisplay) document.documentElement.style.setProperty('--font-display', cfg.fontDisplay);
  if (cfg.fontBody)    document.documentElement.style.setProperty('--font-body',    cfg.fontBody);

  // ── Colores CSS: delega al JS externo que lee la estructura completa del JSON
  // js/VocabularyCityWellDone.js → aplicarColoresCSS(colores)
  if (typeof aplicarColoresCSS === 'function') {
    aplicarColoresCSS(tema.colores);
  }

  // ── Cursor personalizado
  document.body.style.cursor = `url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32'><text y='28' font-size='28'>${tema.cursor}</text></svg>") 16 16,auto`;

  // ── Loading screen
  const iconoCarga = tema.iconoCarga || tema.emojisFlotantes[0] || '⏳';
  document.getElementById('loading-icon-main').textContent  = iconoCarga;
  document.getElementById('loading-title-main').textContent = txt.loadingTitulo || cfg.tema || 'Cargando...';
  const decorLoading = tema.decorLoading || tema.emojisFlotantes.slice(0, 4);
  ['decor-1','decor-2','decor-3','decor-4'].forEach((id, i) => {
    const el = document.getElementById('loading-' + id);
    if (el) el.textContent = decorLoading[i] || '✨';
  });

  // ── Botón Home
  const homeBtn = document.getElementById('home-btn');
  if (homeBtn) {
    homeBtn.href = cfg.rutaInicio || '#';
    homeBtn.textContent = txt.homeBtn || '🏠 Inicio';
  }

  // ── TTS estado inicial
  const ttsEl = document.getElementById('tts-status');
  if (ttsEl) ttsEl.innerHTML = `<span class="tts-dot off"></span>${txt.ttsLeyendo || 'Cargando...'}`;

  // ── Header
  document.getElementById('header-icons').textContent     = cfg.iconosHeader.join(' ');
  document.getElementById('header-badge').textContent     = cfg.titulo;
  document.getElementById('header-subtitulo').textContent = cfg.subtitulo;
  const h1 = document.getElementById('header-titulo');
  if (cfg.tema.includes('→')) {
    const partes = cfg.tema.split('→');
    h1.innerHTML = `${partes[0].trim()} <span>→ ${partes[1].trim()}</span>`;
  } else {
    h1.textContent = cfg.tema;
  }

  // ── Icono usuario
  const userDisplay = document.getElementById('user-name-display');
  if (userDisplay && txt.iconoUsuario) {
    userDisplay.childNodes[0].textContent = txt.iconoUsuario + ' ';
  }

  // ── Comprensión total: solo label y mensaje inicial

  // ── Login
  _set('login-title',  txt.loginTitulo);
  _set('login-sub',    txt.loginSubtitulo);
  _set('start-btn',    txt.loginBoton);

  // ── Level screen
  _set('level-title',         txt.levelTitulo);
  _set('termometro-label',    txt.comprensionLabel);
  _set('comprension-message', txt.comprensionInicio);
  _set('vocab-btn-main',      txt.vocabBtn);
  _set('progress-btn-main',   txt.progressBtn);
  _set('logout-btn-main',     txt.logoutBtn);
  _set('star-filter-text',    txt.starFilterTextoInactivo);
  _set('star-mode-indicator', txt.starModeIndicador);

  // ── Vocab screen
  _set('vocab-titulo',      txt.vocabTitulo);
  _set('vocab-back-btn',    txt.volverBtn);
  _set('stat-lbl-total',    txt.vocabLblTotal);
  _set('stat-lbl-starred',  txt.vocabLblStarred);
  _set('stat-lbl-marcado',  txt.vocabLblMarcado);
  _set('mark-all-btn',      txt.vocabBtnMarcarTodas);
  _set('clear-all-btn',     txt.vocabBtnQuitarTodas);
  _set('filter-starred-lbl', txt.vocabBtnFiltroEstrella);
  const searchInput = document.getElementById('vocab-search');
  if (searchInput && txt.vocabBuscarPlaceholder) searchInput.placeholder = txt.vocabBuscarPlaceholder;

  // ── Progress screen
  _set('progress-titulo',   txt.progressTitulo);
  _set('progress-back-btn', txt.volverMenu);
  _set('ps-lbl-sesiones',   txt.progressLblSesiones);
  _set('ps-lbl-promedio',   txt.progressLblPromedio);
  _set('ps-lbl-mejor',      txt.progressLblMejor);
  _set('ps-lbl-usuario',    txt.progressLblUsuario);
  _set('clear-log-btn', txt.progressBtnBorrar);
  // mostrarBorrarBitacora: true → visible | false → oculto
  const clearBtn = document.getElementById('clear-log-btn');
  if (clearBtn) clearBtn.style.display = cfg.mostrarBorrarBitacora === false ? 'none' : '';

  // ── Quiz screen
  _set('quiz-puntos-lbl',       txt.quizPuntos);
  _set('check-btn',             txt.quizVerificar);
  _set('next-btn',              txt.quizSiguiente);
  _set('question-sound-btn',    txt.quizSonidoBtn);
  _set('quiz-back-btn',         txt.volverMenu);

  // ── Results screen
  _set('result-label',    txt.resultadoLabel);
  _set('completion-title', txt.resultadoNivelComp);
  _set('replay-btn',      txt.resultadoRepetir);
  _set('menu-btn',        txt.resultadoVerNiveles);
  _set('results-back-btn', txt.volverMenu);

  // ── Save toast
  _set('save-toast', txt.guardarToast);

  // ── localStorage prefix
  STORAGE_PREFIX = cfg.storagePrefix ||
    cfg.tema.toLowerCase().replace(/[^a-z0-9]/g, '_').replace(/_+/g, '_');

  // ── Emojis flotantes de fondo
  for (let i = 0; i < 8; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'float-deco';
      el.textContent = tema.emojisFlotantes[Math.floor(Math.random() * tema.emojisFlotantes.length)];
      el.style.left = Math.random() * 100 + 'vw';
      el.style.fontSize = (1.5 + Math.random() * 2) + 'rem';
      el.style.animationDuration = (12 + Math.random() * 8) + 's';
      el.style.animationDelay = Math.random() * 5 + 's';
      document.body.appendChild(el);
    }, i * 300);
  }

  cargarNiveles();
  hideLoadingScreen();
}

// Helper: set textContent solo si el elemento y el valor existen
function _set(id, value) {
  if (!value) return;
  const el = document.getElementById(id);
  if (el) el.textContent = value;
}

// ═══════════════════════════════════════════════════════════════════════════
//  CARGAR NIVELES DESDE JSON
// ═══════════════════════════════════════════════════════════════════════════
function cargarNiveles() {
  const levelGrid = document.getElementById('level-grid');
  const niveles = CONFIG.niveles;
  const nivelesArray = ['nivel1', 'nivel2', 'nivel3', 'nivel4'];
  
  levelGrid.innerHTML = nivelesArray.map((key, idx) => {
    const nivel = niveles[key];
    const colorClass = ['l1', 'l2', 'l3', 'l4'][idx];
    
    return `
      <div class="level-card ${colorClass}" onclick="startQuiz(${idx})">
        <div class="level-icon">${nivel.icono}</div>
        <div class="level-name">${nivel.nombre}</div>
        <div class="level-desc">${nivel.direccion}<br>${nivel.tipo}</div>
        <div class="level-badge">${nivel.badge}</div>
        <div class="star-badge" id="star-badge-${idx}" style="display:none;">0★</div>
        <div class="level-comprension-badge" id="level-comprension-${idx}">
          <div class="level-comprension-text" id="level-comp-text-${idx}"></div>
        </div>
      </div>
    `;
  }).join('');
  
  actualizarComprensionesNiveles();
}

function actualizarComprensionesNiveles() {
  if (!currentUser) return;
  try {
    const totalPalabras = vocab.length;
    const txt2 = CONFIG?.textos || {};

    for (let i = 0; i < 4; i++) {
      const badge = document.getElementById(`level-comprension-${i}`);
      const txtEl = document.getElementById(`level-comp-text-${i}`);
      if (!badge || !txtEl) continue;

      // Palabras únicas acertadas EN ESTE NIVEL específico
      const practicadasNivel = obtenerPalabrasPracticadas(i + 1);
      const correctas = practicadasNivel.size;
      const pct = totalPalabras > 0 ? Math.min(100, Math.round((correctas / totalPalabras) * 100)) : 0;

      if (correctas > 0) {
        badge.style.display = 'block';
        const color = pct >= 90 ? 'var(--green)' : pct >= 75 ? 'var(--color-estrella)' : pct >= 50 ? 'var(--sky)' : 'var(--sand)';
        txtEl.style.color = color;
        // Texto desde JSON: "comprensionNivelTexto" → "comprensión"
        const label = txt2.comprensionNivelTexto || 'comprensión';
        txtEl.textContent = `${pct}% ${label} · ${correctas}/${totalPalabras}`;
      } else {
        badge.style.display = 'none';
      }
    }
  } catch (e) {
    console.error('Error actualizando comprensiones:', e);
  }
}

// ═══════════════════════════════════════════════════════════════════════════
//  TTS
// ═══════════════════════════════════════════════════════════════════════════
function initTTS() {
  if (!window.speechSynthesis) {
    updateTTSStatus(false);
    return;
  }
  
  let tries = 0;
  const check = () => {
    const voices = speechSynthesis.getVoices();
    if (voices.length > 0 || tries++ > 20) {
      updateTTSStatus(voices.some(v => v.lang.startsWith(CONFIG?.textos?.ttsLang || 'en')));
    } else {
      setTimeout(check, 100);
    }
  };
  
  if (speechSynthesis.onvoiceschanged !== undefined) {
    speechSynthesis.onvoiceschanged = check;
  }
  check();
}

function updateTTSStatus(ok) {
  ttsAvailable = ok;
  const el = document.getElementById('tts-status');
  const txt = CONFIG?.textos || {};
  if (ok) {
    el.classList.remove('off');
    el.innerHTML = `<span class="tts-dot"></span>${txt.ttsDisponible || 'Audio Disponible ✓'}`;
  } else {
    el.classList.add('off');
    el.innerHTML = `<span class="tts-dot off"></span>${txt.ttsNoDisponible || 'Audio no disponible'}`;
  }
}

function speak(text) {
  if (!ttsAvailable || !text || !CONFIG) return;
  
  const cleanText = text.replace(/\s*\([^)]*\)/g, '').trim();
  if (!cleanText) return;
  
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(cleanText);
  
  const allVoices = speechSynthesis.getVoices();
  const langPrefix = CONFIG.voz.lang ? CONFIG.voz.lang.split('-')[0] : 'en';
  const voiceName  = CONFIG.voz.voiceName || '';

  // Intentar por nombre exacto primero, luego por idioma
  const byName = voiceName ? allVoices.find(v => v.name === voiceName) : null;
  const byLang = allVoices.filter(v => v.lang.startsWith(langPrefix));
  if (byName)           u.voice = byName;
  else if (byLang.length) u.voice = byLang[0];

  u.lang  = CONFIG.voz.lang  || 'en-US';
  u.rate  = CONFIG.voz.rate  || 1;
  u.pitch = CONFIG.voz.pitch || 1;
  
  speechSynthesis.speak(u);
}

function speakWord(word, btn) {
  speak(word);
  if (btn) {
    btn.style.transform = 'scale(1.3)';
    setTimeout(() => btn.style.transform = 'scale(1)', 500);
  }
}

function loadStars(name) {

//  PALABRAS PRACTICADAS
// ═══════════════════════════════════════════════════════════════════════════
function guardarPalabraPracticada(wordId) {
  if (!currentUser) return;
  try {
    // Guardar en la key global (para termómetro total)
    const keyGlobal = `${STORAGE_PREFIX}_palabras_practicadas_${currentUser.toLowerCase()}`;
    const globalSet = new Set(JSON.parse(localStorage.getItem(keyGlobal) || '[]'));
    globalSet.add(wordId);
    localStorage.setItem(keyGlobal, JSON.stringify([...globalSet]));

    // Guardar también por nivel (para comprensión individual por nivel)
    const keyNivel = `${STORAGE_PREFIX}_palabras_practicadas_nivel${currentLevel + 1}_${currentUser.toLowerCase()}`;
    const nivelSet = new Set(JSON.parse(localStorage.getItem(keyNivel) || '[]'));
    nivelSet.add(wordId);
    localStorage.setItem(keyNivel, JSON.stringify([...nivelSet]));
  } catch (e) {
    console.error('Error guardando palabra practicada:', e);
  }
}

function obtenerPalabrasPracticadas(nivel) {
  if (!currentUser) return new Set();
  try {
    // Sin argumento → key global; con nivel (1-4) → key por nivel
    const key = nivel
      ? `${STORAGE_PREFIX}_palabras_practicadas_nivel${nivel}_${currentUser.toLowerCase()}`
      : `${STORAGE_PREFIX}_palabras_practicadas_${currentUser.toLowerCase()}`;
    const saved = localStorage.getItem(key);
    return saved ? new Set(JSON.parse(saved)) : new Set();
  } catch (e) {
    return new Set();
  }
}

function showSaveToast() {
  const toast = document.getElementById('save-toast');
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 1800);
}

function mostrarComprensionTotal() {
  try {
    const palabrasPracticadas = obtenerPalabrasPracticadas();
    const totalPalabras = vocab.length;
    const comprensionGeneral = totalPalabras > 0
      ? Math.round((palabrasPracticadas.size / totalPalabras) * 100)
      : 0;

    const percentageEl = document.getElementById('comprension-percentage');
    if (percentageEl) percentageEl.textContent = comprensionGeneral + '%';

    const fill = document.getElementById('termometro-fill');
    if (fill) setTimeout(() => { fill.style.width = comprensionGeneral + '%'; }, 80);

    let color, msg;
    if (comprensionGeneral >= 100) {
      color = '#5CB85C';
      msg = `¡PERFECTO! Dominas las ${totalPalabras} palabras`;
    } else if (comprensionGeneral >= 90) {
      color = '#5CB85C';
      msg = `¡EXCELENTE! Dominas ${palabrasPracticadas.size}/${totalPalabras} palabras`;
    } else if (comprensionGeneral >= 75) {
      color = '#FFD700';
      msg = `¡MUY BIEN! Has practicado ${palabrasPracticadas.size}/${totalPalabras} palabras`;
    } else if (comprensionGeneral >= 50) {
      color = '#64B5F6';
      msg = `Buen progreso: ${palabrasPracticadas.size}/${totalPalabras} palabras`;
    } else if (comprensionGeneral > 0) {
      color = '#FFB74D';
      msg = `Sigue practicando: ${palabrasPracticadas.size}/${totalPalabras} palabras`;
    } else {
      color = '#FFB74D';
      msg = CONFIG?.textos?.comprensionInicio || 'Comienza a practicar para mejorar tu nivel';
    }

    if (percentageEl) percentageEl.style.color = color;
    if (fill) fill.style.background = `linear-gradient(90deg, ${color}cc, ${color})`;

    const messageEl = document.getElementById('comprension-message');
    if (messageEl) messageEl.textContent = msg;
  } catch (e) {
    console.error('Error al mostrar comprensión:', e);
  }
}

// ═══════════════════════════════════════════════════════════════════════════
//  QUIZ
// ═══════════════════════════════════════════════════════════════════════════
const levels = [
  { qTypes: ['mc'], dir: 'en_es' },
  { qTypes: ['mc', 'tf'], dir: 'en_es' },
  { qTypes: ['write'], dir: 'es_en' },
  { qTypes: ['mc', 'write', 'tf'], dir: 'mixed' }
];

function startQuiz(lvl) {
  currentLevel = lvl;
  
  let pool = vocab;
  
  if (starFilterActive && starredWords.size > 0) {
    pool = vocab.filter(v => starredWords.has(v.id));
  }
  
  if (pool.length === 0) {
    showCustomAlert('', CONFIG.textos?.alertSinPalabras || 'No hay palabras para practicar');
    return;
  }
  
  questions = generateQuestions(pool, levels[lvl]);
  qIndex = 0;
  score = 0;
  streak = 0;
  wrongAnswers = [];
  quizStartTime = Date.now();
  
  document.querySelectorAll('.container > div').forEach(d => d.style.display = 'none');
  document.getElementById('quiz-screen').style.display = 'block';
  
  const starIndicator = document.getElementById('star-mode-indicator');
  if (starFilterActive && starredWords.size > 0) {
    starIndicator.style.display = 'block';
  } else {
    starIndicator.style.display = 'none';
  }
  
  showQuestion();
}

function generateQuestions(pool, lvlCfg) {
  const shuffled = [...pool].sort(() => Math.random() - 0.5);
  const count = shuffled.length;
  
  return shuffled.slice(0, count).map(item => {
    const qType = lvlCfg.qTypes[Math.floor(Math.random() * lvlCfg.qTypes.length)];
    const dir = lvlCfg.dir === 'mixed' ? (Math.random() > 0.5 ? 'en_es' : 'es_en') : lvlCfg.dir;
    
    if (qType === 'mc') {
      return generateMC(item, dir, pool);
    } else if (qType === 'write') {
      return generateWrite(item, dir);
    } else {
      return generateTF(item, dir, pool);
    }
  });
}

function generateMC(item, dir, pool) {
  const prompt = dir === 'en_es' ? item.word : item.translation;
  const correctAns = dir === 'en_es' ? item.translation : item.word;
  
  const others = pool.filter(v => v.id !== item.id).sort(() => Math.random() - 0.5).slice(0, 3);
  const opts = [correctAns, ...others.map(v => dir === 'en_es' ? v.translation : v.word)].sort(() => Math.random() - 0.5);
  
  return { type: 'mc', prompt, correctAns, options: opts, item, dir };
}

function generateWrite(item, dir) {
  const prompt = dir === 'en_es' ? item.word : item.translation;
  const correctAns = dir === 'en_es' ? item.translation : item.word;
  return { type: 'write', prompt, correctAns, item, dir };
}

function generateTF(item, dir, pool) {
  const isTrue = Math.random() > 0.5;
  let leftWord, rightWord;
  
  if (dir === 'en_es') {
    leftWord = item.word;
    if (isTrue) {
      rightWord = item.translation;
    } else {
      const wrong = pool.filter(v => v.id !== item.id)[Math.floor(Math.random() * (pool.length - 1))];
      rightWord = wrong.translation;
    }
  } else {
    leftWord = item.translation;
    if (isTrue) {
      rightWord = item.word;
    } else {
      const wrong = pool.filter(v => v.id !== item.id)[Math.floor(Math.random() * (pool.length - 1))];
      rightWord = wrong.word;
    }
  }
  
  const statement = `${leftWord} = ${rightWord}`;
  // correctAns: la combinación correcta para mostrar cuando el usuario falla
  const correctAns = dir === 'en_es'
    ? `${item.word} = ${item.translation}`
    : `${item.translation} = ${item.word}`;

  return { type: 'tf', prompt: '', statement, isTrue, correctAns, item, dir };
}

function showQuestion() {
  currentQ = questions[qIndex];
  document.getElementById('quiz-info').textContent = `${CONFIG.textos?.quizPregunta || 'Pregunta'} ${qIndex + 1}/${questions.length}`;
  document.getElementById('score-val').textContent = score;
  const qType = document.getElementById('question-type');
  const qFlag = document.getElementById('question-flag');
  const qText = document.getElementById('question-text');
  const soundBtn = document.getElementById('question-sound-btn');
  const ansArea = document.getElementById('answer-area');
  const checkBtn = document.getElementById('check-btn');
  const nextBtn = document.getElementById('next-btn');
  
  const _t = CONFIG.textos || {}; qType.textContent = currentQ.type === 'mc' ? (_t.quizTipoMC||'SELECCIÓN MÚLTIPLE') : (currentQ.type === 'write' ? (_t.quizTipoWrite||'ESCRIBIR') : (_t.quizTipoTF||'VERDADERO o FALSO'));
  qFlag.textContent = currentQ.dir === 'en_es' ? '🇬🇧→🇪🇸' : '🇪🇸→🇬🇧';
  
  if (currentQ.type === 'tf') {
    qText.textContent = currentQ.statement;
  } else {
    qText.textContent = currentQ.prompt;
  }
  
  if (currentQ.dir === 'en_es' && currentQ.type !== 'tf') {
    soundBtn.style.display = 'block';
    soundBtn.onclick = () => speak(currentQ.prompt);
  } else {
    soundBtn.style.display = 'none';
  }
  
  if (currentQ.type === 'mc') {
    ansArea.innerHTML = `<div class="answer-grid">${currentQ.options.map((o, i) => 
      `<button class="answer-btn" onclick="selectMC('${o.replace(/'/g, "\\'")}', ${i})">${o}</button>`
    ).join('')}</div>`;
    checkBtn.style.display = 'none';
    nextBtn.style.display = 'none';
    
    if (currentQ.dir === 'en_es') {
      setTimeout(() => speak(currentQ.prompt), 300);
    }
  } else if (currentQ.type === 'write') {
    ansArea.innerHTML = `<input type="text" class="answer-input" id="answer-input" placeholder="Escribe tu respuesta...">`;
    checkBtn.style.display = 'block';
    nextBtn.style.display = 'none';
    document.getElementById('answer-input').focus();
    document.getElementById('answer-input').addEventListener('keypress', e => {
      if (e.key === 'Enter') checkAnswer();
    });
  } else {
    ansArea.innerHTML = `
      <div class="tf-buttons">
        <button class="tf-btn" onclick="selectTF(true)">${(CONFIG.textos?.quizTFVerdadero)||'✓ VERDADERO'}</button>
        <button class="tf-btn" onclick="selectTF(false)">${(CONFIG.textos?.quizTFFalso)||'✗ FALSO'}</button>
      </div>
    `;
    checkBtn.style.display = 'none';
    nextBtn.style.display = 'none';
  }
  
  document.getElementById('feedback').style.display = 'none';
}

function selectMC(ans, idx) {
  const correct = isAnswerCorrect(ans, currentQ.correctAns);
  processAnswer(correct);
  
  const delay = correct ? CONFIG.tiempos.respuestaCorrecta : (CONFIG.tiempos.respuestaIncorrecta * 0.7);
  setTimeout(nextQuestion, delay);
}

function selectTF(userAns) {
  const correct = userAns === currentQ.isTrue;
  processAnswer(correct);
  
  const delay = correct ? CONFIG.tiempos.respuestaCorrecta : (CONFIG.tiempos.respuestaIncorrecta * 0.7);
  setTimeout(nextQuestion, delay);
}

function checkAnswer() {
  if (currentQ.type !== 'write') return;
  
  const userAns = document.getElementById('answer-input').value.trim();
  if (!userAns) {
    showCustomAlert('Error', CONFIG.textos?.alertErrorRespuesta||'Por favor escribe una respuesta');
    return;
  }
  
  const correct = isAnswerCorrect(userAns, currentQ.correctAns);
  processAnswer(correct);
  
  document.getElementById('check-btn').style.display = 'none';
  document.getElementById('answer-input').disabled = true;
  
  const delay = correct ? CONFIG.tiempos.respuestaCorrecta : (CONFIG.tiempos.respuestaIncorrecta * 0.7);
  setTimeout(nextQuestion, delay);
}

function normalizeAnswer(str) {
  let clean = str.replace(/\s*\([^)]*\)/g, '');
  clean = clean.replace(/[\u2018\u2019\u201A\u201B\u2032\u0060]/g, "'");
  return clean.toLowerCase().trim().replace(/[.,!?¿¡]/g, '');
}

function isAnswerCorrect(userAns, correctAns) {
  // Soporta variantes separadas por / o por coma (ej: "viejo/vieja", "a lot of / lots of")
  const variants = correctAns.split(/\/|,/).map(v => normalizeAnswer(v)).filter(v => v.length > 0);
  const userNorm = normalizeAnswer(userAns);
  return variants.some(v => v === userNorm);
}

function processAnswer(isCorrect) {
  console.log('processAnswer called, isCorrect:', isCorrect);
  const pts = CONFIG.puntosPorNivel[`nivel${currentLevel + 1}`];
  
  if (isCorrect) {
    score += pts + (streak >= 3 ? 5 : 0);
    streak++;
    
    guardarPalabraPracticada(currentQ.item.id);
    
    const msgs = CONFIG.mensajesCorrectos;
    let msg = msgs[Math.floor(Math.random() * msgs.length)];
    msg = msg.replace('{puntos}', pts);
    msg = msg.replace('{usuario}', currentUser);
    msg = msg.replace('{racha}', streak >= 3 ? `🔥 Racha x${streak}!` : '');
    
    showFeedback(true, msg);
    speak(currentQ.item.word);
    if (CONFIG?.sonidos?.confetti !== false) launchConfetti();
    playSonidoCorrecto();
  } else {
    streak = 0;
    wrongAnswers.push(currentQ.item);
    starredWords.add(currentQ.item.id);
    saveStars();
    
    const msgs = CONFIG.mensajesIncorrectos;
    let msg = msgs[Math.floor(Math.random() * msgs.length)];
    const respuestaCorrecta = currentQ.correctAns || CONFIG.textos?.alertNoDisponible || '—';
    msg = msg.replace('{respuesta}', `<span style="color:#5CB85C;font-weight:900;font-size:1.2em;">${respuestaCorrecta}</span>`);
    
    showFeedback(false, msg);
    playSonidoIncorrecto();
  }
  
  updateStarBadge();
  document.getElementById('score-val').textContent = score;
}

function showFeedback(isCorrect, msg) {
  const fb = document.getElementById('feedback');
  fb.className = 'feedback-bar ' + (isCorrect ? 'correct' : 'wrong');
  fb.innerHTML = msg;
  fb.style.display = 'block';
}

function nextQuestion() {
  qIndex++;
  if (qIndex >= questions.length) {
    showResults();
  } else {
    showQuestion();
  }
}

// ═══════════════════════════════════════════════════════════════════════════
//  RESULTADOS
// ═══════════════════════════════════════════════════════════════════════════
function showResults() {
  document.querySelectorAll('.container > div').forEach(d => d.style.display = 'none');
  document.getElementById('results-screen').style.display = 'block';

  const maxScore = questions.length * CONFIG.puntosPorNivel[`nivel${currentLevel + 1}`];
  // Limitar pct a 100 aunque haya bonus de racha
  const pct = Math.min(100, Math.round((score / maxScore) * 100));

  guardarNivelComprension(pct);
  guardarEntradaBitacora(pct);

  // Tiers desde CONFIG.resultados si existe, sino fallback genérico
  const r = CONFIG.resultados || {};
  let tier;
  if (pct >= 90) tier = { stars: r.stars3 || '⭐⭐⭐', trophy: r.trophy1 || '🏆', msg: (r.msg1 || '¡INCREÍBLE, {usuario}!').replace('{usuario}', currentUser) };
  else if (pct >= 75) tier = { stars: r.stars2 || '⭐⭐', trophy: r.trophy2 || '🥇', msg: (r.msg2 || '¡FANTÁSTICO, {usuario}!').replace('{usuario}', currentUser) };
  else if (pct >= 60) tier = { stars: r.stars1 || '⭐', trophy: r.trophy3 || '🥈', msg: (r.msg3 || '¡Bien hecho, {usuario}!').replace('{usuario}', currentUser) };
  else tier = { stars: r.stars0 || '', trophy: r.trophy4 || '🎁', msg: (r.msg4 || '¡No te rindas, {usuario}!').replace('{usuario}', currentUser) };

  document.getElementById('trophy-emoji').textContent = tier.trophy;
  document.getElementById('stars-row').textContent = tier.stars;
  document.getElementById('final-score').textContent = `${score}/${maxScore}`;
  document.getElementById('result-msg').textContent = tier.msg;
  document.getElementById('comp-bar').style.width = pct + '%';
  document.getElementById('comp-num').textContent = pct + '%';

  // Grade desde CONFIG.resultados.grades o fallback genérico
  const grades = r.grades || { 90: '🏆 EXCELENTE', 75: '🥇 MUY BIEN', 60: '⭐ BIEN', 0: '📚 SIGUE PRACTICANDO' };
  const gradeKey = pct >= 90 ? 90 : pct >= 75 ? 75 : pct >= 60 ? 60 : 0;
  document.getElementById('comp-grade').textContent = grades[gradeKey];

  const review = document.getElementById('review-section');
  if (wrongAnswers.length > 0) {
    review.innerHTML = `
      <div class="review-title">📚 Palabras a repasar (${wrongAnswers.length})</div>
      <div class="review-list">
        ${wrongAnswers.map(w => `
          <div class="review-item">
            <div class="review-word">${w.word}</div>
            <div class="review-translation">${w.translation}</div>
          </div>
        `).join('')}
      </div>
    `;
  } else {
    review.innerHTML = `<div class="review-title">${r.perfectMsg || '🎉 ¡Perfecto! No hubo errores'}</div>`;
  }

  document.getElementById('replay-btn').onclick = () => startQuiz(currentLevel);
}

// ═══════════════════════════════════════════════════════════════════════════
//  EFECTOS DE SONIDO
//  Configuración desde CONFIG.sonidos:
//    correcto:   "aplausos" | "ninguno"
//    incorrecto: "fart" | "buzz" | "ninguno"
//    confetti:   true | false
// ═══════════════════════════════════════════════════════════════════════════
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
// Inicializar y desbloquear AudioContext en el primer clic del usuario
document.addEventListener('click', function initAudio() {
  getAudioCtx();
  document.removeEventListener('click', initAudio);
}, { once: true });

// playWrongBuzz: buzzer (oscilador sawtooth que baja de tono)
function playWrongBuzz() {
  try {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(120, ctx.currentTime);
    osc.frequency.linearRampToValueAtTime(60, ctx.currentTime + 0.3);
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.3);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.3);
  } catch(e) { console.log('playWrongBuzz error:', e); }
}

// playFart: sonido de pedo (brown noise con wobble)
function playFart() {
  try {
    const ctx = getAudioCtx();
    const duration = 0.6 + Math.random() * 0.5;
    const bufferSize = Math.floor(ctx.sampleRate * duration);
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    let lastOut = 0;
    for (let i = 0; i < bufferSize; i++) {
      const white = Math.random() * 2 - 1;
      lastOut = (lastOut + (0.02 * white)) / 1.02;
      const t = i / ctx.sampleRate;
      const wobble = Math.sin(2 * Math.PI * (30 + Math.random() * 20) * t) * 0.3;
      data[i] = (lastOut * 3.5 + wobble) * (1 - t / duration);
    }
    const source = ctx.createBufferSource();
    source.buffer = buffer;
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(300 + Math.random() * 200, ctx.currentTime);
    filter.frequency.linearRampToValueAtTime(80, ctx.currentTime + duration);
    const gainNode = ctx.createGain();
    gainNode.gain.setValueAtTime(0.7, ctx.currentTime);
    gainNode.gain.linearRampToValueAtTime(0, ctx.currentTime + duration);
    source.connect(filter);
    filter.connect(gainNode);
    gainNode.connect(ctx.destination);
    source.start();
    source.stop(ctx.currentTime + duration);
  } catch(e) { console.log('playFart error:', e); }
}

// playAplausos: ráfaga de notas ascendentes
function playAplausos() {
  try {
    const ctx = getAudioCtx();
    const freqs = [523, 659, 784, 1047];
    freqs.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      const t = ctx.currentTime + i * 0.07;
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.18, t + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(t);
      osc.stop(t + 0.28);
    });
  } catch(e) { console.log('playAplausos error:', e); }
}

function playSonidoCorrecto() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const tipo = CONFIG?.sonidos?.correcto || 'aplausos';
    const play = () => { if (tipo === 'aplausos') playAplausos(); };
    if (audioCtx.state === 'running') { play(); }
    else { audioCtx.resume().then(play).catch(e => console.log('resume error:', e)); }
  } catch(e) { console.log('playSonidoCorrecto error:', e); }
}

function playSonidoIncorrecto() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const tipo = CONFIG?.sonidos?.incorrecto || 'buzz';
    const play = () => {
      if (tipo === 'fart') playFart();
      if (tipo === 'buzz') playWrongBuzz();
    };
    if (audioCtx.state === 'running') { play(); }
    else { audioCtx.resume().then(play).catch(e => console.log('resume error:', e)); }
  } catch(e) { console.log('playSonidoIncorrecto error:', e); }
}
// ═══════════════════════════════════════════════════════════════════════════
//  CONFETTI (cae de arriba hacia abajo)
//  CONFIG.temaVisual.emojisConfetti → emojis a mostrar
//  CONFIG.temaVisual.coloresConfetti → colores de confetti
//  CONFIG.sonidos.confetti → true | false
// ═══════════════════════════════════════════════════════════════════════════
function launchConfetti() {
  const emojis  = CONFIG.temaVisual.emojisConfetti;
  const colores = CONFIG.temaVisual.coloresConfetti;
  const cantidad = 60;

  for (let i = 0; i < cantidad; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      const isEmoji = Math.random() > 0.4;

      el.style.cssText = `
        position:fixed;
        pointer-events:none;
        z-index:9999;
        left:${Math.random() * 100}vw;
        top:-40px;
      `;

      if (isEmoji) {
        el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        el.style.fontSize = (1 + Math.random() * 1.2) + 'rem';
        el.style.background = 'none';
      } else {
        const size = (6 + Math.random() * 8) + 'px';
        el.style.width  = size;
        el.style.height = size;
        el.style.background   = colores[Math.floor(Math.random() * colores.length)];
        el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      }

      document.body.appendChild(el);

      // Velocidad desde CONFIG.temaVisual.confettiVelocidad (ms): menor = más rápido
      const velBase = CONFIG?.temaVisual?.confettiVelocidad ?? 1800;
      const duration   = velBase + Math.random() * (velBase * 0.7);
      const drift      = (Math.random() - 0.5) * 120;
      const rotation   = (Math.random() - 0.5) * 720;
      const startY     = -40;
      const endY       = window.innerHeight + 60;
      let startTime    = null;

      function step(ts) {
        if (!startTime) startTime = ts;
        const progress = Math.min((ts - startTime) / duration, 1);
        const eased    = progress; // caída lineal natural
        el.style.transform = `
          translateY(${startY + (endY - startY) * eased}px)
          translateX(${drift * Math.sin(progress * Math.PI)}px)
          rotate(${rotation * progress}deg)
        `;
        el.style.opacity = progress < 0.85 ? '1' : (1 - (progress - 0.85) / 0.15).toString();
        if (progress < 1) requestAnimationFrame(step);
        else el.remove();
      }
      requestAnimationFrame(step);

    }, i * 20);
  }
}

// ═══════════════════════════════════════════════════════════════════════════
//  MODALES
//  Textos desde CONFIG.textos:
//    modalIconoConfirm → icono del modal de confirmación
//    modalIconoAlert   → icono del modal de alerta
//    modalCancelar     → texto botón cancelar
//    modalConfirmar    → texto botón confirmar
//    modalEntendido    → texto botón OK
// ═══════════════════════════════════════════════════════════════════════════
function showCustomConfirm(title, message, onConfirm) {
  const txt = CONFIG?.textos || {};
  const overlay = document.createElement('div');
  overlay.className = 'custom-modal-overlay';
  overlay.style.display = 'flex';
  overlay.innerHTML = `
    <div class="custom-modal">
      <div class="modal-icon">${txt.modalIconoConfirm || '❓'}</div>
      <div class="modal-title">${title}</div>
      <div class="modal-message">${message}</div>
      <div class="modal-buttons">
        <button class="modal-btn modal-btn-cancel">${txt.modalCancelar || '✗ Cancelar'}</button>
        <button class="modal-btn modal-btn-confirm">${txt.modalConfirmar || '✓ Confirmar'}</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.querySelector('.modal-btn-cancel').onclick  = () => overlay.remove();
  overlay.querySelector('.modal-btn-confirm').onclick = () => { overlay.remove(); if (onConfirm) onConfirm(); };
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
}

function showCustomAlert(title, message) {
  const txt = CONFIG?.textos || {};
  const overlay = document.createElement('div');
  overlay.className = 'custom-modal-overlay';
  overlay.style.display = 'flex';
  overlay.innerHTML = `
    <div class="custom-modal">
      <div class="modal-icon">${txt.modalIconoAlert || '⭐'}</div>
      <div class="modal-title">${title}</div>
      <div class="modal-message">${message}</div>
      <div class="modal-buttons">
        <button class="modal-btn modal-btn-ok">${txt.modalEntendido || '✓ Entendido'}</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.querySelector('.modal-btn-ok').onclick = () => overlay.remove();
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
}

// ═══════════════════════════════════════════════════════════════════════════
//  PROGRESS SCREEN
// ═══════════════════════════════════════════════════════════════════════════
// ═══════════════════════════════════════════════════════════════════════════
//  BITÁCORA DE PROGRESO
// ═══════════════════════════════════════════════════════════════════════════
function bitacoraKey() {
  return `${STORAGE_PREFIX}_bitacora_${currentUser.toLowerCase()}`;
}

function cargarBitacora() {
  try { return JSON.parse(localStorage.getItem(bitacoraKey()) || '[]'); }
  catch(e) { return []; }
}

function guardarEntradaBitacora(porcentaje) {
  if (!currentUser) return;
  try {
    const duracionMs = quizStartTime ? Date.now() - quizStartTime : 0;
    const totalSeg = Math.round(duracionMs / 1000);
    const min = Math.floor(totalSeg / 60);
    const seg = totalSeg % 60;
    const nivelKey = `nivel${currentLevel + 1}`;
    const nivelInfo = CONFIG.niveles[nivelKey];
    const correctas = questions.length - wrongAnswers.length;
    const entrada = {
      nivel: currentLevel + 1,
      nivelNombre: nivelInfo ? nivelInfo.nombre : `Nivel ${currentLevel + 1}`,
      nivelIcono: nivelInfo ? nivelInfo.icono : '📖',
      direccion: nivelInfo ? nivelInfo.direccion : '',
      tipo: nivelInfo ? nivelInfo.tipo : '',
      fecha: new Date().toLocaleDateString('es-GT', { day:'2-digit', month:'short' }),
      hora: new Date().toLocaleTimeString('es-GT', { hour:'2-digit', minute:'2-digit', hour12:true }),
      correctas, total: questions.length,
      errores: wrongAnswers.length,
      durMin: min, durSeg: seg,
      porcentaje, timestamp: Date.now()
    };
    const bitacora = cargarBitacora();
    bitacora.unshift(entrada);
    localStorage.setItem(bitacoraKey(), JSON.stringify(bitacora));
  } catch(e) { console.error('Error guardando bitácora:', e); }
}

function guardarNivelComprension(porcentaje) {
  try {
    const key = `${STORAGE_PREFIX}_comprension_${currentUser.toLowerCase()}`;
    const data = JSON.parse(localStorage.getItem(key) || '{}');
    data[`nivel${currentLevel + 1}`] = porcentaje;
    const niveles = Object.values(data);
    data.general = niveles.length > 0 ? Math.round(niveles.reduce((a, b) => a + b, 0) / niveles.length) : 0;
    localStorage.setItem(key, JSON.stringify(data));
  } catch(e) {}
}

function formatDuracion(min, seg) {
  if (min === 0) return `${seg} seg.`;
  return `${min} min.${seg > 0 ? ' ' + seg + ' seg.' : ''}`;
}

function pctColor(pct) {
  if (pct >= 90) return '#5CB85C';
  if (pct >= 75) return '#FFD700';
  if (pct >= 50) return '#64B5F6';
  return '#FFB74D';
}

function pctEmoji(pct) {
  if (pct >= 90) return '🏆'; if (pct >= 75) return '🥇';
  if (pct >= 60) return '🥈'; return '📚';
}

function showProgress() {
  document.querySelectorAll('.container > div').forEach(d => d.style.display = 'none');
  document.getElementById('progress-screen').style.display = 'block';
  renderProgress();
}

function renderProgress() {
  const bitacora = cargarBitacora();
  document.getElementById('ps-usuario').textContent = currentUser || '—';
  document.getElementById('ps-sesiones').textContent = bitacora.length;
  if (bitacora.length > 0) {
    const avg = Math.round(bitacora.reduce((a,e) => a + e.porcentaje, 0) / bitacora.length);
    const mejor = Math.max(...bitacora.map(e => e.porcentaje));
    const avgEl = document.getElementById('ps-promedio');
    const mejorEl = document.getElementById('ps-mejor');
    avgEl.textContent = avg + '%'; avgEl.style.color = pctColor(avg);
    mejorEl.textContent = mejor + '%'; mejorEl.style.color = pctColor(mejor);
  } else {
    document.getElementById('ps-promedio').textContent = '—';
    document.getElementById('ps-mejor').textContent = '—';
  }
  const logEl = document.getElementById('progress-log');
  if (bitacora.length === 0) {
    logEl.innerHTML = '<div class="progress-empty">Aún no hay sesiones registradas.<br>¡Completa un nivel para verlo aquí!</div>';
    return;
  }
  const starsForPct = p => p >= 90 ? '⭐⭐⭐' : p >= 75 ? '⭐⭐' : p >= 50 ? '⭐' : '';
  logEl.innerHTML = bitacora.map(e => `
    <div class="progress-entry">
      <div class="pe-top">
        <span class="pe-nivel">Niv.${e.nivel} ${starsForPct(e.porcentaje)}</span>
        <span class="pe-nombre">${e.nivelIcono} ${e.nivelNombre}</span>
        <span class="pe-tipo">${e.direccion}</span>
        <span class="pe-pct" style="color:${pctColor(e.porcentaje)}">${pctEmoji(e.porcentaje)} ${e.porcentaje}%</span>
      </div>
      <div class="pe-bottom">
        <span class="pe-fecha">📅 ${e.fecha} ${e.hora}</span>
        <span class="pe-score">✅ ${e.correctas}/${e.total}</span>
        <span class="pe-errors ${e.errores > 0 ? 'has-errors' : ''}">❌ ${e.errores} error${e.errores !== 1 ? 'es' : ''}</span>
        <span class="pe-time">⏱ ${formatDuracion(e.durMin, e.durSeg)}</span>
      </div>
    </div>`).join('');
}

function confirmarBorrarBitacora() {
  const bitacora = cargarBitacora();
  if (bitacora.length === 0) { showCustomAlert(CONFIG.textos?.progressBtnBorrar||'Bitácora', CONFIG.textos?.alertBitacoraVacia||'No hay entradas que borrar.'); return; }
  showCustomConfirm(CONFIG.textos?.progressBtnBorrar||'Borrar Bitácora',
    `¿Borrar las ${bitacora.length} entrada${bitacora.length !== 1 ? 's' : ''}? No se puede deshacer.`,
    () => { localStorage.removeItem(bitacoraKey()); renderProgress(); showCustomAlert('✓', CONFIG.textos?.alertBitacoraBorrada||'Bitácora borrada.'); }
  );
}

  const loaded = await cargarConfiguracion();
  if (!loaded) return;
  
  aplicarConfiguracion();
  initTTS();
  initLogin();

init();
